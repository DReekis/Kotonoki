<div class="vote-widget" id="vote-widget-{{ dispatch.id }}">
  {% if current_user %}
    <button 
      type="button"
      class="vote-btn {% if user_vote_value == 1 %}upvoted{% endif %}"
      hx-post="/dispatch/{{ dispatch.id }}/vote"
      hx-vals='{"value": 1}'
      hx-target="#vote-widget-{{ dispatch.id }}"
      hx-swap="outerHTML"
      title="Upvote"
      aria-label="Upvote this dispatch">
      <span class="vote-arrow">▲</span>
      <span class="vote-count">{{ dispatch.upvotes_count }}</span>
    </button>
    <div class="vote-divider"></div>
    <button 
      type="button"
      class="vote-btn {% if user_vote_value == -1 %}downvoted{% endif %}"
      hx-post="/dispatch/{{ dispatch.id }}/vote"
      hx-vals='{"value": -1}'
      hx-target="#vote-widget-{{ dispatch.id }}"
      hx-swap="outerHTML"
      title="Downvote"
      aria-label="Downvote this dispatch">
      <span class="vote-arrow">▼</span>
      <span class="vote-count">{{ dispatch.downvotes_count }}</span>
    </button>
  {% else %}
    <a href="/auth?tab=login&next={{ request.path }}" class="vote-btn" title="Log in to vote" aria-label="Log in to upvote">
      <span class="vote-arrow">▲</span>
      <span class="vote-count">{{ dispatch.upvotes_count }}</span>
    </a>
    <div class="vote-divider"></div>
    <a href="/auth?tab=login&next={{ request.path }}" class="vote-btn" title="Log in to vote" aria-label="Log in to downvote">
      <span class="vote-arrow">▼</span>
      <span class="vote-count">{{ dispatch.downvotes_count }}</span>
    </a>
  {% endif %}
</div>
